name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@^11.10.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: Pack CLI
        run: pnpm --filter proof-pr exec npm pack
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/cli/proof-pr-*.tgz
      - name: Check npm package version
        id: npm-version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "proof-pr@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select npm publish auth mode
        id: npm-auth
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm-version.outputs.published != 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "mode=token-fallback" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is configured. npm 11 will still prefer trusted publishing when npm has a matching publisher; otherwise it can fall back to the token."
          else
            echo "mode=trusted-publishing" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not configured. Publishing will use npm trusted publishing via GitHub OIDC."
          fi
      - name: Publish CLI to npm with trusted publishing
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm-version.outputs.published != 'true' && steps.npm-auth.outputs.mode == 'trusted-publishing'
        working-directory: packages/cli
        run: npm publish --access public --registry https://registry.npmjs.org
      - name: Publish CLI to npm with token fallback
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm-version.outputs.published != 'true' && steps.npm-auth.outputs.mode == 'token-fallback'
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --registry https://registry.npmjs.org
