name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - name: Pack CLI
        run: pnpm --filter proof-pr exec npm pack
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: packages/cli/proof-pr-*.tgz
      - name: Check npm package version
        id: npm-version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if npm view "proof-pr@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check npm token
        id: npm-token
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm-version.outputs.published != 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not configured. GitHub Release was created; publish npm locally or add the secret and rerun."
          fi
      - name: Publish CLI to npm
        if: startsWith(github.ref, 'refs/tags/v') && steps.npm-version.outputs.published != 'true' && steps.npm-token.outputs.available == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter proof-pr exec npm publish --access public --provenance --registry https://registry.npmjs.org
