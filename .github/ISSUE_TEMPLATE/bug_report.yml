name: Bug 报告
description: 报告一个可复现的 ProofPR 问题。
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 请描述不符合预期的行为。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现方式
      description: 尽量提供最小 diff、命令或仓库链接。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ProofPR 版本
      placeholder: "0.1.0"
  - type: textarea
    id: logs
    attributes:
      label: 日志或报告输出
      render: text
