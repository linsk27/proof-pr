locale: zh-CN
preset: dependency-careful

riskThreshold: high

sensitivePaths:
  - ".github/workflows/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "tsconfig*.json"
  - "**/.env*"

requireTests:
  enabled: true
  paths:
    - "src/**"
    - "packages/**/src/**"

secrets:
  enabled: true

dependencies:
  flagNewPackages: true
