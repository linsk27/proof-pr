name: ProofPR
description: Review pull request evidence, scope, and safety before maintainers spend time on it.
author: ProofPR contributors
inputs:
  github-token:
    description: GitHub token used to read pull request diffs and post comments.
    required: false
    default: ${{ github.token }}
  config-path:
    description: Path to the ProofPR configuration file.
    required: false
    default: .proofpr.yml
  fail-on:
    description: Lowest risk level that should fail the workflow. One of low, medium, high, never. Defaults to riskThreshold from .proofpr.yml.
    required: false
    default: ""
  comment:
    description: Whether to create or update a pull request comment.
    required: false
    default: "true"
  annotations:
    description: Whether to emit GitHub workflow annotations for findings.
    required: false
    default: "true"
  sarif-output:
    description: Optional path to write a SARIF report for GitHub Code Scanning upload.
    required: false
    default: ""
  html-output:
    description: Optional path to write a standalone visual HTML report.
    required: false
    default: ""
outputs:
  risk:
    description: Overall ProofPR risk level.
  findings:
    description: Number of ProofPR findings.
  evidence-score:
    description: Evidence score from 0 to 100.
  review-decision:
    description: Review gate decision.
runs:
  using: node20
  main: packages/github-action/action-dist/index.js
branding:
  icon: shield
  color: blue
